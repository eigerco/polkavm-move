[package]
name = "move-to-polka"
version = "0.1.0"
edition = "2021"
description = "Generate An Instruction Set code from Move"
license = "Apache-2.0"
publish = false

[dependencies]
anstyle = "1.0"
anyhow = "1.0.52"
atty = "0.2.14"
blake2-rfc = "0.2"
blst = "0.3"
blake3 = "1.5"
bulletproofs = "4.0.0"
bs58 = "0.5.0"
curve25519-dalek = { package = "curve25519-dalek-ng", version = "4" }
build-tools = { path = "../build-tools" }
chrono = { version = "0.4" }
clap = { version = "4.5", features = ["derive"] }
# we can not upgrade the next 2 until aptos-move updates
codespan = "0.11.1"
codespan-reporting = "0.11.1"
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
env_logger = { version = "0.11", features = ["color"] }
extension-trait = "1.0.1"
gix = { version = "0.79", features = [
  "blocking-http-transport-reqwest-rust-tls",
  "blocking-network-client",
] }
hex = "0.4"
hex-literal = "1.0"
k256 = { version = "0.13", features = ["ecdsa-core", "sha256"] }
itertools = "0.14"
libc = "0.2"
# we can not upgrade llvm as ubuntu does not have a newer version
llvm-sys = "191.0"
log = "0.4.14"
merlin = "3"
move-binary-format = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
move-bytecode-source-map = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
move-command-line-common = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
move-compiler-v2 = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
move-core-types = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
move-ir-types = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
move-model = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
move-package = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
move-stackless-bytecode = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
num = "0.4.0"
num-traits = "0.2"
once_cell = "1.21"
rand = "0.8"
polkavm = { workspace = true }
polkavm-linker = { workspace = true }
polkavm-move-native = { path = "../polkavm-move-native", features = ["host"] }
primitive-types = "0.14"
ripemd = "0.1"
sha2 = "0.10"
sha3 = "0.10"
siphasher = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
serial_test = "3.2.0"

[build-dependencies]
anyhow = "1.0.98"
build-tools = { path = "../build-tools" }
cargo_metadata = "0.23"
move-stdlib = { git = "https://github.com/eigerco/aptos-core.git", branch = "main" }
thiserror = "2.0"
